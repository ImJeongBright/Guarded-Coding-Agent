[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-coding-agent"
version = "0.1.0"
description = "Local deterministic filesystem, shell and git execution gateway"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
guard = "guarded_agent.cli:main"

[tool.setuptools.packages.find]
include = ["guarded_agent*"]
